[project]
name = "codeguru"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "langchain",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
    "pypdf",
    "pymupdf",
    "pillow",
    "pytesseract",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "groq",
]

[tool.vercel]
entrypoint = "codeguru_backend:app"
